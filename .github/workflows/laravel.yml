name: Laravel and frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-tests:
    name: PHP tests (PHP ${{ matrix.php-version }})
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: semizzy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo_mysql, bcmath, curl, dom, fileinfo, intl, json, openssl, pcntl, tokenizer, xml
          coverage: none
      - name: Verify PHP process-control support for MariaDB concurrency tests
        run: php -r "if (! function_exists('pcntl_fork') || ! function_exists('pcntl_waitpid')) { fwrite(STDERR, 'pcntl is required for the dedicated MariaDB concurrency suite.'.PHP_EOL); exit(1); }"
      - name: Prepare writable Laravel runtime directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - uses: ramsey/composer-install@v3
      - name: Lint all PHP application, migration, route, and test files
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Vite assets for HTTP feature tests
        run: |
          npm install
          npm run build
      - name: Run targeted VTU multi-provider router tests
        run: php artisan test tests/Feature/MultiProviderVtuRouterTest.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      - name: Run targeted education coordinator and MariaDB concurrency tests
        run: php artisan test tests/Feature/EducationOrderCoordinatorTest.php tests/Feature/EducationOrderMariaDbConcurrencyTest.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      - name: Run focused provider catalogue import tests
        run: php artisan test tests/Feature/ProviderCatalogueImportTest.php tests/Feature/VtpassCatalogueFailureSafetyTest.php tests/Feature/GsubzCatalogueIdentifierCompatibilityTest.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      - name: Run full Laravel test suite
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
