name: Laravel and frontend checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-composer-lockfile:
    name: Resolve Composer lockfile for PHP 8.3+
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, curl, dom, fileinfo, intl, json, openssl, pcntl, tokenizer, xml
          coverage: none
      - name: Resolve dependencies for the declared PHP platform
        run: composer update --no-install --no-scripts --no-interaction --prefer-dist
      - name: Audit locked Composer dependencies
        run: composer audit --locked
      - name: Commit compatible Composer lockfile directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.json composer.lock
          if git diff --cached --quiet; then
            echo "Composer manifest and lockfile are already current."
            exit 0
          fi
          git commit -m "Resolve Composer lockfile for PHP 8.3 compatibility"
          git push origin HEAD:main

  php-tests:
    name: PHP tests (PHP ${{ matrix.php-version }})
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4']
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      VTU_VTPASS_BASE_URL: https://sandbox.vtpass.com/api
      VTU_VTPASS_API_KEY: ci-test-vtpass-api-key
      VTU_VTPASS_SECRET_KEY: ci-test-vtpass-secret-key
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: semizzy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, pdo_mysql, bcmath, curl, dom, fileinfo, intl, json, openssl, pcntl, tokenizer, xml
          coverage: none
      - name: Verify PHP process-control support for MariaDB concurrency tests
        run: php -r "if (! function_exists('pcntl_fork') || ! function_exists('pcntl_waitpid')) { fwrite(STDERR, 'pcntl is required for the dedicated MariaDB concurrency suite.'.PHP_EOL); exit(1); }"
      - name: Prepare writable Laravel runtime directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - uses: ramsey/composer-install@v3
      - name: Audit locked Composer dependencies
        run: composer audit --locked
      - name: Record resolved passkey and WebAuthn dependency versions
        run: |
          composer show laravel/passkeys --format=json
          composer show web-auth/webauthn-lib --format=json
      - name: Lint all PHP application, migration, route, and test files
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Vite assets for HTTP feature tests
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Run targeted VTU multi-provider router tests
        run: php artisan test tests/Feature/MultiProviderVtuRouterTest.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      - name: Run targeted education coordinator and MariaDB concurrency tests
        run: php artisan test tests/Feature/EducationOrderCoordinatorTest.php tests/Feature/EducationOrderMariaDbConcurrencyTest.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      - name: Run payout, peer-transfer, bulk-recovery, and payout race regressions
        run: php artisan test tests/Feature/BankPayoutSafetyTest.php tests/Feature/PeerWalletTransferTest.php tests/Feature/PeerWalletTransferMariaDbConcurrencyTest.php tests/Feature/PaymentRefundWorkflowTest.php tests/Feature/PaymentRefundMariaDbConcurrencyTest.php tests/Feature/VtuBulkPurchaseBatchTest.php tests/Feature/BankPayoutMariaDbConcurrencyTest.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      - name: Run focused provider catalogue import tests
        run: php artisan test tests/Feature/ProviderCatalogueImportTest.php tests/Feature/VtpassCatalogueFailureSafetyTest.php tests/Feature/GsubzCatalogueIdentifierCompatibilityTest.php
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
      - name: Run full Laravel test suite
        run: php artisan test
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: semizzy_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array

  mariadb-error-123-diagnostic:
    name: MariaDB error 123 diagnostic (${{ matrix.snapshot-isolation }})
    strategy:
      fail-fast: false
      matrix:
        snapshot-isolation: ['default', 'OFF']
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: semizzy_test
      DB_USERNAME: root
      DB_PASSWORD: root
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    services:
      mysql:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: semizzy_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, bcmath, curl, dom, fileinfo, intl, json, openssl, pcntl, tokenizer, xml
          coverage: none
      - name: Prepare writable Laravel runtime directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - uses: ramsey/composer-install@v3
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Record MariaDB version and snapshot isolation mode
        run: |
          container_id="$(docker ps --filter 'ancestor=mariadb:11' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          docker exec "$container_id" mariadb -uroot -proot -e "SELECT VERSION(); SHOW VARIABLES LIKE 'innodb_snapshot_isolation';"
          if [ "${{ matrix.snapshot-isolation }}" = "OFF" ]; then
            docker exec "$container_id" mariadb -uroot -proot -e "SET GLOBAL innodb_snapshot_isolation=OFF;"
          fi
          docker exec "$container_id" mariadb -uroot -proot -e "SHOW VARIABLES LIKE 'innodb_snapshot_isolation';"
      - name: Isolate error 123 by financial concurrency test file
        run: |
          container_id="$(docker ps --filter 'ancestor=mariadb:11' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          # Disposable CI database only: capture queries to identify the connection
          # that emitted error 123. Never enable general logging on production.
          docker exec "$container_id" mariadb -uroot -proot -e "SET GLOBAL log_output='TABLE'; SET GLOBAL general_log=ON;"
          for test_file in tests/Feature/BankPayoutMariaDbConcurrencyTest.php tests/Feature/PaymentRefundMariaDbConcurrencyTest.php tests/Feature/PeerWalletTransferMariaDbConcurrencyTest.php; do
            before="$(docker logs "$container_id" 2>&1 | grep -Fc "Got error 123 when reading table" || true)"
            set +e
            php artisan test "$test_file"
            test_status=$?
            set -e
            after="$(docker logs "$container_id" 2>&1 | grep -Fc "Got error 123 when reading table" || true)"
            echo "MARIADB_ERROR_123_DELTA[$test_file]=$((after - before))"
            if [ "$test_status" -ne 0 ]; then exit "$test_status"; fi
          done
          echo "SQL statements for connections that emitted error 123:"
          thread_ids="$(docker logs "$container_id" 2>&1 | awk '/Got error 123 when reading table/ { for (i=1; i<=NF; i++) if ($i == "[ERROR]") { print $(i-1); break } }' | sort -u | paste -sd, -)"
          if [ -n "$thread_ids" ]; then
            docker exec "$container_id" mariadb -uroot -proot -e "SELECT event_time, thread_id, command_type, LEFT(argument, 500) AS statement FROM mysql.general_log WHERE thread_id IN ($thread_ids) ORDER BY event_time DESC LIMIT 100;"
          else
            echo "No error-123 connection IDs could be extracted from the server log."
          fi
          docker exec "$container_id" mariadb -uroot -proot -e "SET GLOBAL general_log=OFF;"
      - name: Report MariaDB error 123 occurrences without suppressing them
        if: always()
        run: |
          container_id="$(docker ps --filter 'ancestor=mariadb:11' --format '{{.ID}}' | head -n 1)"
          if [ -z "$container_id" ]; then
            echo "MariaDB service container was not available for log collection."
            exit 0
          fi
          docker logs "$container_id" 2>&1 | grep -F "Got error 123 when reading table" || true
          count="$(docker logs "$container_id" 2>&1 | grep -Fc "Got error 123 when reading table" || true)"
          echo "MARIADB_ERROR_123_COUNT=$count"
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
