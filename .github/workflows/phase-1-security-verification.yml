name: Phase 1 security verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-sqlite:
    name: Laravel suite (SQLite)
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      VTU_VTPASS_BASE_URL: https://sandbox.vtpass.com/api
      VTU_VTPASS_API_KEY: ci-test-vtpass-api-key
      VTU_VTPASS_SECRET_KEY: ci-test-vtpass-secret-key
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_sqlite, sqlite3, dom, curl, fileinfo, openssl, tokenizer, xml
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Record resolved passkey and WebAuthn dependency versions
        run: |
          composer show laravel/passkeys --format=json
          composer show web-auth/webauthn-lib --format=json
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: php artisan test

  laravel-mariadb:
    name: Laravel suite (MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: semizzy_test
          MARIADB_USER: semizzy
          MARIADB_PASSWORD: semizzy_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      VTU_VTPASS_BASE_URL: https://sandbox.vtpass.com/api
      VTU_VTPASS_API_KEY: ci-test-vtpass-api-key
      VTU_VTPASS_SECRET_KEY: ci-test-vtpass-secret-key
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: semizzy_test
      DB_USERNAME: semizzy
      DB_PASSWORD: semizzy_test_password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, dom, curl, fileinfo, openssl, tokenizer, xml
          coverage: none
      - run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: php artisan test --testsuite=Feature --filter='BankPayoutSafetyTest|BankBeneficiaryClaimProtectionTest|PeerWalletTransferTest|VtuBulkPurchaseBatchTest|VtuOrderMariaDbConcurrencyTest|BankPayoutMariaDbConcurrencyTest|TransactionPinSecurityTest|TransactionPinMariaDbConcurrencyTest|TwoFactorAtomicityTest|TwoFactorAuthenticationTest|MobileNumberVerificationTest|PasswordResetWorkflowTest|UserSessionManagementTest|LoginChallengeTest|LoginOtpChannelDeliveryTest|AuthFlowTest|PasskeyOriginAndConfirmationRegressionTest|StaffAccessManagementTest|AdminDirectUrlAuthorizationTest|AdminControlPermissionBoundaryTest|PlatformSettingsAccessTest|IntegrationSettingsAccessTest'
