name: Build cPanel frontend assets

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'public/**'
      - 'vite.config.*'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/cpanel-assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend assets
        run: npm run build
      - name: Upload cPanel build ZIP
        uses: actions/upload-artifact@v4
        with:
          name: semizzy-cpanel-build
          path: public/build/
          if-no-files-found: error
          retention-days: 7
